; SacredBild matchmaker. Every key can also be given on the command line in lower camel case
; (e.g. -listen=:2107 -webListen= -logSensitiveData=1), which overrides this file.
[Matchmaker]
; UDP address hosts and players talk to (docs/UDP_PROTOCOL.md). Players set [Net] Matchmaker=<server>:<port>.
; Without a host (:2107) IPv4 and IPv6; 0.0.0.0:2107 or [::]:2107 for one family only.
Listen=:2107
; HTTP address of the web page listing the current games (no addresses shown). Empty = no web page.
WebListen=:8080
; 1 = log IP addresses and ports (game created, joins, refusals). Off by default: nothing identifying is logged.
LogSensitiveData=0
; Seconds without a REGISTER after which a game is dropped.
GameTimeout=20
; How often hosts are told to send REGISTER, in milliseconds (must be shorter than GameTimeout).
RefreshMs=5000
; Games listed at most, and per host IPv4 address / IPv6 /64 network.
MaxGames=1000
MaxGamesPerAddress=4
; Requests per second per IPv4 address / IPv6 /64 network (bursts of twice that); more are dropped silently.
RequestsPerSecond=20
; Heading of the web page.
Title=Sacred games
