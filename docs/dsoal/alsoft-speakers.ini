[general]
# Sacred DSOAL "Speakers": play stereo output as speakers, plain amplitude panning, no HRTF.
# The speaker layout (stereo, 5.1, 7.1, ...) is not set here: OpenAL Soft takes it from the Windows sound settings.
# Every key below is documented in the commented default alsoft.ini of the official DSOAL package.
stereo-mode=speakers
stereo-encoding=basic
