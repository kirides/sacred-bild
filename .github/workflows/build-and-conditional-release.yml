name: Build and conditional release

on:
  push:
    tags:
      - 'v*'
    branches:
      - '**'
    paths-ignore:
      - '**/*.md'

  pull_request:
    branches:
      - '**'
    paths-ignore:
      - '**/*.md'

  workflow_dispatch:

env:
  # Same vcpkg commit as local builds and GD3D11.
  VCPKG_COMMIT: 504152f3f2a9fc3290c4214d05ff641be2c9b4c1

jobs:
  build:
    runs-on: windows-2025-vs2026

    outputs:
      artifact-id-release: ${{ steps.artifact-upload-release.outputs.artifact-id }}
      artifact-id-debug: ${{ steps.artifact-upload-debug.outputs.artifact-id }}
      artifact-id-gear: ${{ steps.artifact-upload-gear.outputs.artifact-id }}
      artifact-id-mdk: ${{ steps.artifact-upload-mdk.outputs.artifact-id }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # The preset's "Visual Studio 18 2026" generator needs CMake 4.2+.
      - name: Setup CMake
        uses: lukka/get-cmake@latest

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT }}
          # Only clone/bootstrap vcpkg and export VCPKG_ROOT here; the manifest install
          # (x86-windows-static) runs in the CMake configure step through the preset's toolchain.
          runVcpkgInstall: false

      # run-vcpkg exports the removed 'x-gha' backend; override it with a file cache.
      - name: Use file-based vcpkg binary cache
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:GITHUB_WORKSPACE\vcpkg_binary_cache" | Out-Null
          "VCPKG_BINARY_SOURCES=clear;files,$env:GITHUB_WORKSPACE\vcpkg_binary_cache,readwrite" >> $env:GITHUB_ENV

      - name: Restore vcpkg binaries and downloads
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ github.workspace }}/vcpkg_binary_cache
            ${{ github.workspace }}/vcpkg/downloads
          key: vcpkg-x86-windows-static-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg.json', 'triplets/*.cmake', 'ports/**') }}
          restore-keys: |
            vcpkg-x86-windows-static-${{ env.VCPKG_COMMIT }}-

      - name: Configure
        shell: pwsh
        run: cmake --preset msvc-x86

      - name: Save vcpkg binaries and downloads
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ github.workspace }}/vcpkg_binary_cache
            ${{ github.workspace }}/vcpkg/downloads
          key: vcpkg-x86-windows-static-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg.json') }}

      - name: Build
        shell: pwsh
        run: cmake --build --preset release

      - name: Prepare release structure
        id: package
        shell: pwsh
        run: |
          # The version comes from src/bild/SacredBild_version.txt (tools/bump_versions.py); the mod index looks for SacredBild-v*.zip.
          $version = (Get-Content "src/bild/SacredBild_version.txt" -Raw).Trim()
          $relDir = "SacredBild-v$version"
          $buildDir = "out/build/msvc-x86/RelWithDebInfo"

          # Laid out like the game folder, so the zip extracts directly on top of it.
          New-Item -Path "$relDir/SacredBild" -ItemType Directory -Force | Out-Null
          Copy-Item -Path "$buildDir/ddraw.dll", "$buildDir/ddraw.pdb", "$buildDir/ddraw.map", "src/bild/settings/SacredBild.ini", "src/bild/SacredBild_version.txt" -Destination $relDir
          Copy-Item -Path "LICENSE" -Destination "$relDir/SacredBild"

          "release-dir=$relDir" >> $env:GITHUB_OUTPUT
          "debug-dir=SacredBild-debug-v$version" >> $env:GITHUB_OUTPUT

      - name: Upload debug artifact (with PDB and map)
        id: artifact-upload-debug
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.debug-dir }}
          path: ${{ steps.package.outputs.release-dir }}
          if-no-files-found: error

      - name: Remove PDB and map for release
        shell: pwsh
        run: |
          $relDir = "${{ steps.package.outputs.release-dir }}"
          Remove-Item -Path "$relDir/ddraw.pdb", "$relDir/ddraw.map" -Force

      - name: Upload release artifact (no PDB)
        id: artifact-upload-release
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.release-dir }}
          path: ${{ steps.package.outputs.release-dir }}
          if-no-files-found: error

      # Sacred Gear: a release of its own, laid out like the game folder (SacredGear.dll, an example mod in mods\).
      - name: Prepare Sacred Gear release structure
        id: package-gear
        shell: pwsh
        run: |
          $version = (Get-Content "src/gear/SacredGear_version.txt" -Raw).Trim()
          $relDir = "SacredGear-v$version"
          $buildDir = "out/build/msvc-x86/RelWithDebInfo"

          New-Item -Path "$relDir/mods" -ItemType Directory -Force | Out-Null
          Copy-Item -Path "$buildDir/SacredGear.dll", "$buildDir/SacredGear.pdb", "src/gear/SacredGear_version.txt" -Destination $relDir
          Copy-Item -Path "src/gear/examples/hello" -Destination "$relDir/mods/hello" -Recurse
          Copy-Item -Path "docs/Gear.md", "LICENSE" -Destination $relDir

          "release-dir=$relDir" >> $env:GITHUB_OUTPUT

      - name: Upload Sacred Gear artifact
        id: artifact-upload-gear
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package-gear.outputs.release-dir }}
          path: ${{ steps.package-gear.outputs.release-dir }}
          if-no-files-found: error

      # The mod development kit (editor definitions of the Lua API, docs, template, examples), generated from src/gear/meta and published
      # from here (it is not committed). The artifact keeps one name, so the release asset is always sacred-gear-mdk.zip.
      - name: Build the Sacred Gear MDK
        shell: pwsh
        run: python tools/gearapi/gen_gear_mdk.py

      - name: Upload Sacred Gear MDK artifact
        id: artifact-upload-mdk
        uses: actions/upload-artifact@v7
        with:
          name: sacred-gear-mdk
          path: out/mdk/sacred-gear-mdk
          if-no-files-found: error

  # The mod index must match the version files (tools/make_mod_index.py), and the versioning tools have tests.
  versions:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Test the versioning tools
        run: python3 tools/test_bump_versions.py

      - name: Check mod-index.json
        run: python3 tools/make_mod_index.py --check

      - name: Check sacred-dsoal.json
        run: python3 tools/make_dsoal_index.py --check

  # Checks that need neither Windows nor the game: the kernel's tests (native side mocked), the Lua API annotations against the code and
  # docs/GearApi.md, the changelog histories.
  text-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install LuaJIT
        run: sudo apt-get update && sudo apt-get install -y luajit

      - name: Kernel tests
        run: luajit src/gear/tests/kernel_test.lua

      - name: Check the Lua API annotations
        run: python3 tools/gearapi/check_gear_api.py

      - name: Check the changelog histories
        run: python3 tools/make_changelog.py --check

  create-release:
    if: github.event_name == 'push' && (github.ref_name == 'main' || github.ref_type == 'tag')
    needs: [build]
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        id: download-artifact
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id-release }},${{ needs.build.outputs.artifact-id-debug }},${{ needs.build.outputs.artifact-id-gear }},${{ needs.build.outputs.artifact-id-mdk }}
          path: downloaded-artifacts

      - name: Create ZIPs for release
        shell: pwsh
        run: |
          $downloadPath = "${{ steps.download-artifact.outputs.download-path }}"
          Get-ChildItem -Path $downloadPath -Directory | ForEach-Object {
            $dir = $_.FullName
            Write-Host "Listing $dir"
            Get-ChildItem -Path $dir -Recurse

            $zipName = "$dir.zip"
            7z a -tzip -mx=7 -mmt=on "$zipName" "$dir/*"
            Write-Host "Created $zipName"
          }

      - name: Calculate nightly release info
        if: github.ref_type != 'tag'
        id: nightly-info
        shell: pwsh
        run: |
          $shortHash = $env:GITHUB_SHA.Substring(0, 7)
          $date = Get-Date -Format 'dd.MM.yyyy HH:mm'
          "tag=nightly-$env:GITHUB_RUN_ID" >> $env:GITHUB_OUTPUT
          "name=Nightly - $shortHash ($date)" >> $env:GITHUB_OUTPUT

      - name: Create nightly release
        if: github.ref_type != 'tag'
        uses: ncipollo/release-action@v1.21.0
        with:
          allowUpdates: true
          artifactErrorsFailBuild: true
          artifacts: "${{ steps.download-artifact.outputs.download-path }}/*.zip"
          commit: ${{ github.sha }}
          generateReleaseNotes: true
          name: ${{ steps.nightly-info.outputs.name }}
          prerelease: true
          removeArtifacts: true
          tag: ${{ steps.nightly-info.outputs.tag }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create regular release
        if: github.ref_type == 'tag'
        uses: ncipollo/release-action@v1.21.0
        with:
          allowUpdates: true
          artifactErrorsFailBuild: true
          artifacts: "${{ steps.download-artifact.outputs.download-path }}/*.zip"
          generateReleaseNotes: true
          token: ${{ secrets.GITHUB_TOKEN }}
