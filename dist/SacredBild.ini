; SacredBild settings (read at game start)

[Launcher]
; Before the game starts, a window offers the common settings below (resolution, frame limit, UI size, ...) and
; saves them here. 1 = start the game right away; hold Shift while the game starts to show the window anyway.
HideSettingsWindow=0

[Display]
; Render resolution. 0 = desktop resolution. 1024 x 768 runs the original game without patches.
Width=0
Height=0
; Window frame: auto = a frame (title bar to move it) when the window is smaller than the screen, none when it
; fills the screen. 1 = never a frame, 0 = always. The area inside the frame has the render resolution either way.
Borderless=auto
; Keep the mouse inside the game window while it is in the foreground (multiple monitors, a smaller window on a
; wide screen). Hold Alt to move the mouse out of the window. Alt+Space then Move moves a framed window.
ClipCursor=1
; The game's own frame limit in game (it uses 60). 0 = off, e.g. 144 for a 144 Hz display. Menus are unchanged.
FpsLimit=60
; Frame limit while the game is in the background (another window has the focus), in game and in the menus. 0 = off.
FpsLimitInactive=20
; Direct3D 9 backend: wait for the display's refresh when presenting (1), or show frames right away (0).
VSync=1
; Direct3D 9 backend: frames the CPU may prepare ahead of the GPU. 1 = lowest input latency.
MaxFrameLatency=1

[UI]
; The game's 1024x768 UI is drawn centered and scaled. 0 = as large as fits the screen height;
; otherwise a fixed factor (1 = native pixel size), capped at what fits.
Scale=0
; Where Scale applies. InGame = the in-game UI only; the menus (start menu, options, ...), the full-screen windows
; in game (options, save/load, character export, map) and the loading screen always fill the screen height.
; Full = those too.
ScaleMode=InGame
; Bilinear filtering for the scaled UI (0 = keep the game's sharp point sampling).
LinearFilter=1
; In game, place the HUD windows as set in [UI.Layout] below.
; 0 = keep the whole UI in the centered 1024x768 area. Menus and full-screen windows always stay centered.
Anchor=1

[UI.Layout]
; Where each in-game window goes. The game lays every window out for a 1024x768 screen; that layout is moved
; to X,Y, each 0..4096, measured in the room the screen leaves around it at the current UI scale:
; 0 = against the left / top edge, 2048 = centered, 4096 = against the right / bottom edge.
; Windows given the same position keep their original arrangement: e.g. Inventory, Stats and Equipment all at
; 2048,4096 sit side by side at the bottom center as in the original game.
Taskbar=2048,4096
Chat=2048,4096
Inventory=0,4096
Stats=4096,0
Equipment=4096,0
Minimap=4096,0
; Party portraits (multiplayer)
Portraits=0,0
; Blacksmith, merchant, combat art master, chest, cube and trade windows
Shops=0,0

[Render]
; Texture memory the game may keep loaded, in MB. 0 = the game's own value, at least 256.
TextureBudgetMB=0
; Merge the world view's thousands of small draw calls into few large ones (0 = draw as the game does).
Batch=1
; Let the GPU clip merged draws instead of Direct3D 7 on the CPU.
BatchNoClip=1
; Hand merged draws to Direct3D in vertex buffers instead of plain memory.
BatchVertexBuffer=1
; Send 3D models (characters and their shadows) through the same vertex buffers, merged where they can be.
BatchModels=1
; Hand the ground's quads to the merging directly instead of through three device calls per quad.
BatchGround=1
; Hand the objects' and water's quads to the merging directly instead of through two device calls per texture change.
BatchSprites=1
; Skin (animate) characters and their shadows in a vertex shader instead of on the CPU. Needs [DDraw] Backend=d3d9.
GpuSkinning=1
; Keep the ground's tiles and blend layers in vertex buffers (built once as they come into view) and draw them in a
; few calls per frame instead of the game rebuilding every tile each frame. Needs [DDraw] Backend=d3d9.
GroundMesh=1
; Characters not drawn in the last frames get their skeleton posed every Nth frame instead of every frame
; (most animated characters are off screen). 1 = every frame, as the game does. Needs GpuSkinning.
OffscreenPoses=4
; Advance the 3D animations on a second thread while the frame starts drawing (needs a second CPU core).
AsyncAnimation=1
; Threads that sample the characters' animations each frame, split by character. 0 = automatic (CPU cores - 2,
; at most 4); 1 = on one thread, as Granny does it.
AnimationThreads=0
; Hash index in front of the game's record caches (looked up for every ground tile and object).
RecordIndex=1
; Guard the sound system with a user-mode lock instead of a kernel mutex (the frame takes it several times per object).
SoundLock=1
; Replace the game's slow x87 math helpers (float to integer conversion) with faster ones that give the same results.
FastMath=1
; Copy small textures into large shared pages so draws with different textures can be merged too.
Atlas=1
; Page size in texels (clamped to what the GPU supports), pages per texture format, largest texture copied.
AtlasPageSize=8192
AtlasPages=2
AtlasMaxTextureSize=512

[Screenshot]
; Print Screen saves the whole screen as Capture\shotNNNN.png in the game folder. jpg = JPEG instead (smaller).
Format=png

[Net]
; LAN games over VPNs. Hosting: the gameserver Sacred starts for your game announces it on every network adapter
; (VPN adapters included) with that adapter's address, and to players who list your PC under Hosts.
Relay=1
; Hosting: UDP port for those players, for the UDP game connection (Udp) and the matchmaker (allow it in the
; firewall on the host).
Port=2105
; Joining: PCs whose LAN games should show up although their broadcasts don't reach you (VPNs like WireGuard
; or Tailscale). Comma-separated IP addresses or names, e.g. Hosts=10.8.0.2, 10.8.0.3:2105
Hosts=
; Send each message to the server right away in both data flow modes. With MODEM/ISDN the game holds small
; messages back until the previous one is acknowledged (Nagle's algorithm), adding latency. 0 = as the game does.
NoDelay=1
; Hosting: seconds a joining player has to send its first message to the gameserver. The game allows 5, which
; slow or distant connections can miss ("connect timed out"). Minimum 5.
JoinTimeout=30
; The game connection over UDP instead of TCP when the other side has Udp=1 too: lost packets are resent after
; about one round trip instead of 300 ms and more, the connection recovers right away after an outage and survives
; a change of address (Wi-Fi to mobile). Joining a host without it connects over TCP as before.
Udp=0
; Joining a host that has IPv4 and IPv6 addresses over UDP: IPv6 or IPv4 is tried first, the other one as well if
; there is no answer within a second.
Prefer=IPv6
; Matchmaking server (name or address, optionally :port, default 2107; empty = none). Its games show up in the LAN
; list, and joining one gets you introduced to the host, so that hosts need no port forwarding (with Udp=1 on both
; sides).
Matchmaker=
; Hosting: list your games at the matchmaker. Its web page shows their name and players, not your address; the
; SacredBild players it lists them for get the address, as they need it to connect.
Publish=1

[DDraw]
; d3d9 = SacredBild runs the game's DirectDraw / Direct3D 7 on Direct3D 9 itself (no DDrawCompat needed).
; chain = load the ddraw.dll below behind SacredBild instead (DDrawCompat or another wrapper).
Backend=d3d9
; Backend=chain: ddraw implementation relative to the game folder. Empty = Windows' own ddraw.dll.
Chain=SacredBild\DDrawCompat.dll
; Backend=d3d9: d3d9.dll to use, e.g. DXVK's (relative to the game folder or absolute). Empty: a d3d9.dll next
; to the game exe if there is one, else Windows' own.
D3D9=
; Play the intro and cutscene movies through Media Foundation instead of the game's DirectShow path (window stays
; responsive). Always on with Backend=d3d9; with Backend=chain, 0 = the game's own player.
MediaFoundation=1

[Debug]
; Log draw-call statistics and frame timings once per second to SacredBild.log.
D3DStats=0
; Sample the presenting thread and write SacredBild-profile.txt every 15 seconds.
Profiler=0
ProfilerIntervalUs=500
; Press Scroll Lock in game to log one frame of UI drawing (what is drawn where, and by which game code) and the
; tooltips shown during the next 5 seconds to SacredBild.log. For finding UI elements that end up in the wrong place.
UiTrace=0
; Play the movies through the fallback (DirectShow into a system memory surface) even where Media Foundation works,
; as on systems without it (Windows 7, Windows N editions, Wine).
MovieFallback=0
; With AnimationThreads: every 2 s sample the animations on one thread and on the threads from the same state and
; compare the results (logged); a difference keeps them on one thread for the session.
AnimationCheck=0
; Compare Granny's character skinning with SacredBild's own (groundwork for skinning on the GPU), logged every 10 s.
SkinCheck=0
; When the game crashes, write SacredBild-crash-<date>-<time>.dmp next to the game exe (please attach it to bug
; reports). 0 = off, 1 = small (threads and the memory they point to), 2 = all memory (hundreds of MB).
CrashDump=1
