; SacredBild settings (read at game start)

[Display]
; Render resolution. 0 = desktop resolution. 1024 x 768 runs the original game without patches.
Width=0
Height=0
; Remove the window frame so the window's client area matches the render resolution.
Borderless=1

[UI]
; The game's 1024x768 UI is drawn centered and scaled. 0 = as large as fits the screen height;
; otherwise a fixed factor (1 = native pixel size), capped at what fits.
Scale=0
; Bilinear filtering for the scaled UI (0 = keep the game's sharp point sampling).
LinearFilter=1

[Render]
; Texture memory the game may keep loaded, in MB. 0 = the game's own value, at least 256.
TextureBudgetMB=0
; Merge the world view's thousands of small draw calls into few large ones (0 = draw as the game does).
Batch=1
; Copy small textures into large shared pages so draws with different textures can be merged too.
Atlas=1
; Page size in texels (clamped to what the GPU supports), pages per texture format, largest texture copied.
AtlasPageSize=4096
AtlasPages=4
AtlasMaxTextureSize=512

[DDraw]
; ddraw implementation loaded behind SacredBild, relative to the game folder.
; Empty = Windows' own ddraw.dll.
Chain=SacredBild\DDrawCompat.dll

[Debug]
; Log draw-call statistics and frame timings once per second to SacredBild.log.
D3DStats=1
; Sample the presenting thread and write SacredBild-profile.txt every 15 seconds.
Profiler=0
ProfilerIntervalUs=500
